# docker-compose.yml — Local development stack
# Postgres is Supabase (remote). Set DB_* in backend/.env — no local db service.
version: '3.9'
services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    env_file: ./backend/.env
    ports:
      - '8000:8000'
    depends_on: [redis]

  celery:
    build: ./backend
    command: celery -A atlas worker -l info
    volumes:
      - ./backend:/app
    env_file: ./backend/.env
    depends_on: [redis]

  frontend:
    build: ./frontend
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - '5173:5173'
