# Hostinger KVM 2 production stack.
# Postgres stays on Supabase (set DB_* in .env).
# Ollama runs on the VPS for local LLM fallback — not on your laptop.
#
# Usage:
#   cp backend/.env.example backend/.env   # fill secrets on the server
#   echo 'VITE_API_URL=/api' > .env
#   docker compose -f docker-compose.vps.yml up -d --build
#   docker exec -it atlas_ollama ollama pull llama3.2:3b
#   docker exec -it atlas_backend python manage.py migrate
#
# Google Sign-In: add https://atlas-ph.tech to Google Cloud OAuth
# "Authorized JavaScript origins" (see HOSTINGER_VPS_DEPLOY.md).

services:
  redis:
    image: redis:7-alpine
    container_name: atlas_redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - atlas

  ollama:
    image: ollama/ollama:latest
    container_name: atlas_ollama
    volumes:
      - ollama_data:/root/.ollama
    # Localhost only on the host — Django reaches it via Docker DNS "ollama"
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped
    networks:
      - atlas
    # KVM 2 has no GPU; CPU inference is expected and slower.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.vps
    container_name: atlas_backend
    env_file:
      - ./backend/.env
    environment:
      DEBUG: "False"
      ENVIRONMENT: production
      DJANGO_SETTINGS_MODULE: atlas.settings.prod
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_DEFAULT_MODEL: llama3.2:3b
      EMBEDDING_PROVIDER: local
      LOCAL_EMBEDDING_MODEL: BAAI/bge-base-en-v1.5
      DEFAULT_LLM_PROVIDER: groq
      WEB_CONCURRENCY: "2"
      PORT: "8000"
      SECURE_SSL_REDIRECT: "true"
    depends_on:
      - redis
      - ollama
    restart: unless-stopped
    networks:
      - atlas

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Same-origin /api via nginx — do not use Render URLs here
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-140618226788-lt31psljafm1en4n3aajo054thn5kfin.apps.googleusercontent.com}
    container_name: atlas_frontend
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - atlas

  nginx:
    image: nginx:alpine
    container_name: atlas_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - atlas

volumes:
  redis_data:
  ollama_data:

networks:
  atlas:
    driver: bridge
